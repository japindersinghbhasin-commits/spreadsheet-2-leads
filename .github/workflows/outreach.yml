name: Daily 200 Outreach Campaign

on:
  # schedule:
  #   - cron: '0 9 * * *'
  # Manual trigger only (automatic schedule disabled upon user request)
  workflow_dispatch:

jobs:
  send-outreach:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install httpx

      - name: Run Cold Outreach Engine
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL || 'https://script.google.com/macros/s/AKfycbxPWGIP1Odjh6kbGz_eG7FD7Ly3BwFU7Rk4Kk8oD3I7Pes92-pP9WOYv4Hqk48Gt2YJ/exec' }}
          DELAY_MIN: 40
          DELAY_MAX: 80
        run: |
          python send_emails.py --send --limit 200

      - name: Save and Commit Sent History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sent_history.csv
          git commit -m "Auto-update sent history after daily outreach" || echo "No changes to commit"
          git push
